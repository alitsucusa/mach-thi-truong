# Cứ 30 phút lấy tin và dữ liệu mới rồi đăng lại trang lên GitHub Pages.
# Repo công khai thì GitHub Actions và Pages đều miễn phí.
name: Cập nhật dữ liệu

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Lấy tin, lịch kinh tế và dữ liệu thị trường
        run: |
          python scripts/fetch_news.py
          python scripts/fetch_market.py
        env:
          # Nguồn nào tạm lỗi (hoặc COT chưa có báo cáo mới) thì script lấy lại bản đang có trên trang
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
